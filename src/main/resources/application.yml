spring:
  application:
    name: positive-ai-code-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/positive_ai_code?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 628965
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
server:
  port: 8080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.xr.positiveaicode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用部署：由后端 /api/deployed/{key}/ 提供静态文件（经 Nginx 反代 /api 即可）
# deploy-host 须指向该接口前缀；deploy-root 为落盘目录（默认 user.dir/tmp/code_deploy）
code:
  deploy-host: http://localhost:8080/api/deployed
  # 留空则使用 {user.dir}/tmp/code_deploy
  deploy-root:
